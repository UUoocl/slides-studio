<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Shape Mask</title>
    <style>
        body {
            background-color: #000000;
        }

        .none {
        position: absolute;
        left: 0%;
        top: 0%;
        transform: translateX(0%) translateY(0%);
        border-radius: 0%;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
        }
    </style>
</head>
<body>
    <div id="container" class="none"></div>
    <script>
        const broadcastChannels={}; 
        
        window.addEventListener('DOMContentLoaded', async(event) => {
            broadcastChannels.cameraShapes = new BroadcastChannel("cameraShapes_channel");
            broadcastChannels.cameraShapes.onmessage = (event) => {
                console.log(event);
                document.getElementById("container").className = event.data
            };
        })
    </script>
</body>
</html>
